<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora +30%</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background:#1e1e1e;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    background:#2b2b2b;
    padding:30px;
    border-radius:15px;
    width:500px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

h2{
    text-align:center;
    color:#ffd700;
}

input{
    width:100%;
    padding:12px;
    font-size:20px;
    border-radius:8px;
    border:none;
    margin-top:10px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:12px;
    font-size:18px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

.resultado{
    margin-top:25px;
    font-size:18px;
    line-height:1.8;
}

.final{
    font-size:24px;
    color:#00ff66;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="card">

<h2>Calculadora +30%</h2>

<label>Valor do Painel (R$)</label>
<input type="number" id="valor" placeholder="100000">

<button onclick="calcular()">Calcular</button>

<div class="resultado" id="resultado"></div>

</div>

<script>

function moeda(v){
    return v.toLocaleString('pt-BR',{
        style:'currency',
        currency:'BRL'
    });
}

function calcular(){

    let valor = parseFloat(document.getElementById("valor").value);

    if(isNaN(valor)){
        alert("Digite um valor.");
        return;
    }

    let acrescimo = valor * 0.30;
    let total = valor * 1.30;

    document.getElementById("resultado").innerHTML = `
    <strong>Se o Total no painel for ${moeda(valor)}, o preço final será:</strong>
    <br><br>

    ${moeda(valor)} + 30% (${moeda(acrescimo)}) = <b>${moeda(total)}</b>
    <br><br>

    Ou
    <br>

    ${moeda(valor)} × 1,30 = <b>${moeda(total)}</b>

    <hr>

    <div class="final">
    Valor que será cobrado ao cliente: ${moeda(total)}
    </div>
    `;

}

</script>

</body>
</html>